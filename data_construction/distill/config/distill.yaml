# Shared rollout configuration for the 9B -> 27B -> 122B distillation cascade.
# The active values below are the 9B preset. When switching stages, select one
# model and apply the matching resource values documented beside each option.

name: qwen35_9b_distill
task: distill_rollout

source_data: /path/to/filtered_input.parquet
data_dir: /path/to/qwen35_9b_distill
output_dir: /path/to/qwen35_9b_distill
hf_datasets_cache_dir: /path/to/qwen35_9b_distill/hf_datasets_cache

num_splits: 400

# Select exactly one model.
model: /path/to/Qwen3.5-9B
# model: /path/to/Qwen3.5-27B
# model: /path/to/Qwen3.5-122B-A10B

# Matching resource presets:
#   9B:   tensor_parallel_size=1, slurm.gpus=1, max_concurrent=16
#   27B:  tensor_parallel_size=2, slurm.gpus=2, max_concurrent=8
#   122B: tensor_parallel_size=4, slurm.gpus=4, max_concurrent=4
prompt: prompts/distill.txt
use_image: true
enable_thinking: false

rollouts_per_sample: 4
temperature: 1.0
top_p: 0.95
top_k: 20
min_p: 0.0
presence_penalty: 1.5
repetition_penalty: 1.0
max_tokens: 16384
max_retries: 3
request_timeout: 1800
max_concurrent: 16
max_pending_multiplier: 1

success_dir_name: rollouts
failed_dir_name: failed_rollouts
valid_key: rollout_valid

split_workers: 8
split_arrow_threads: 2

vllm:
  container: /path/to/vllm.sif
  pythonpath: /path/to/vllm_extra
  runtime_cache_root: /path/to/qwen35_9b_distill/runtime_cache
  max_model_len: 64000
  tensor_parallel_size: 1
  max_num_seqs: 64
  gpu_memory_utilization: 0.90
  gpu_min_free_gb: 30
  startup_timeout: 600
  base_port: 9700
  clean_process: true
  enable_expert_parallel: false
  enforce_eager: true
  async_scheduling: true
  enable_chunked_prefill: true

slurm:
  partition: gpu
  quota_type: spot
  reserved_min_running: 80
  reserved_quota_type: reserved
  spot_quota_type: spot
  gpus: 1
  time: 43200
  exclude: "SH-IDCA1404-10-140-54-101,SH-IDCA1404-10-140-54-116"
